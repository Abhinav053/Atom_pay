# =========================================================
# AtomPay Microservices Ecosystem — Render Blueprint
# =========================================================

services:

  # =======================================================
  # REDIS / KEY VALUE
  # =======================================================
  - type: keyvalue
    name: atompay-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru


  # =======================================================
  # 1. API GATEWAY
  # =======================================================
  - type: web
    name: atompay-api-gateway
    runtime: docker
    dockerfilePath: api-gateway/Dockerfile
    plan: free
    healthCheckPath: /api

    envVars:
      - key: PORT
        value: "3000"

      - key: DATABASE_URL
        sync: false

      - key: REDIS_URL
        fromService:
          name: atompay-redis
          type: keyvalue
          property: connectionString

      - key: MONGO_URL
        sync: false

      - key: JWT_SECRET
        generateValue: true

      - key: AUTH_SERVICE_URL
        fromService:
          name: atompay-auth-service
          type: web
          property: host

      - key: WALLET_SERVICE_URL
        fromService:
          name: atompay-wallet-service
          type: web
          property: host

      - key: PAYMENT_SERVICE_URL
        fromService:
          name: atompay-payment-service
          type: web
          property: host

      - key: REFUND_SERVICE_URL
        fromService:
          name: atompay-refund-service
          type: web
          property: host

      - key: WEBHOOK_SERVICE_URL
        fromService:
          name: atompay-webhook-service
          type: web
          property: host

      - key: LEDGER_SERVICE_URL
        fromService:
          name: atompay-ledger-service
          type: web
          property: host

      - key: NOTIFICATION_SERVICE_URL
        fromService:
          name: atompay-notification-service
          type: web
          property: host


  # =======================================================
  # 2. AUTH SERVICE
  # =======================================================
  - type: web
    name: atompay-auth-service
    runtime: docker
    dockerfilePath: services/auth-service/Dockerfile
    plan: free

    envVars:
      - key: PORT
        value: "3001"

      - key: DATABASE_URL
        sync: false

      - key: REDIS_URL
        fromService:
          name: atompay-redis
          type: keyvalue
          property: connectionString

      - key: JWT_SECRET
        fromService:
          name: atompay-api-gateway
          type: web
          envVarKey: JWT_SECRET

      - key: BREVO_API_KEY
        sync: false

      - key: SENDER_EMAIL
        sync: false


  # =======================================================
  # 3. WALLET SERVICE
  # =======================================================
  - type: web
    name: atompay-wallet-service
    runtime: docker
    dockerfilePath: services/wallet-service/Dockerfile
    plan: free

    envVars:
      - key: PORT
        value: "3002"

      - key: DATABASE_URL
        sync: false

      - key: REDIS_URL
        fromService:
          name: atompay-redis
          type: keyvalue
          property: connectionString


  # =======================================================
  # 4. PAYMENT SERVICE
  # =======================================================
  - type: web
    name: atompay-payment-service
    runtime: docker
    dockerfilePath: services/payment-service/Dockerfile
    plan: free

    envVars:
      - key: PORT
        value: "3003"

      - key: DATABASE_URL
        sync: false

      - key: REDIS_URL
        fromService:
          name: atompay-redis
          type: keyvalue
          property: connectionString


  # =======================================================
  # 5. REFUND SERVICE
  # =======================================================
  - type: web
    name: atompay-refund-service
    runtime: docker
    dockerfilePath: services/refund-service/Dockerfile
    plan: free

    envVars:
      - key: PORT
        value: "3004"

      - key: DATABASE_URL
        sync: false

      - key: REDIS_URL
        fromService:
          name: atompay-redis
          type: keyvalue
          property: connectionString


  # =======================================================
  # 6. WEBHOOK SERVICE
  # =======================================================
  - type: web
    name: atompay-webhook-service
    runtime: docker
    dockerfilePath: services/webhook-service/Dockerfile
    plan: free

    envVars:
      - key: PORT
        value: "3005"

      - key: DATABASE_URL
        sync: false

      - key: REDIS_URL
        fromService:
          name: atompay-redis
          type: keyvalue
          property: connectionString

      - key: MONGO_URL
        sync: false


  # =======================================================
  # 7. LEDGER SERVICE
  # =======================================================
  - type: web
    name: atompay-ledger-service
    runtime: docker
    dockerfilePath: services/ledger-service/Dockerfile
    plan: free

    envVars:
      - key: PORT
        value: "3006"

      - key: DATABASE_URL
        sync: false


  # =======================================================
  # 8. NOTIFICATION SERVICE
  # =======================================================
  - type: web
    name: atompay-notification-service
    runtime: docker
    dockerfilePath: services/notification-service/Dockerfile
    plan: free

    envVars:
      - key: PORT
        value: "3007"

      - key: REDIS_URL
        fromService:
          name: atompay-redis
          type: keyvalue
          property: connectionString

      - key: MONGO_URL
        sync: false


  # =======================================================
  # 9. PAYMENT WORKER
  # =======================================================
  - type: worker
    name: atompay-payment-worker
    runtime: docker
    dockerfilePath: workers/payment-worker/Dockerfile
    plan: free

    envVars:
      - key: DATABASE_URL
        sync: false

      - key: REDIS_URL
        fromService:
          name: atompay-redis
          type: keyvalue
          property: connectionString

      - key: MONGO_URL
        sync: false

      - key: PAYMENT_WEBHOOK_URL
        fromService:
          name: atompay-webhook-service
          type: web
          property: host


  # =======================================================
  # 10. OUTBOX PUBLISHER WORKER
  # =======================================================
  - type: worker
    name: atompay-outbox-publisher
    runtime: docker
    dockerfilePath: workers/outbox-publisher.Dockerfile
    plan: free

    envVars:
      - key: DATABASE_URL
        sync: false

      - key: REDIS_URL
        fromService:
          name: atompay-redis
          type: keyvalue
          property: connectionString


  # =======================================================
  # 11. RECONCILIATION WORKER
  # =======================================================
  - type: worker
    name: atompay-reconciliation-worker
    runtime: docker
    dockerfilePath: workers/reconciliation-worker/Dockerfile
    plan: free

    envVars:
      - key: DATABASE_URL
        sync: false

      - key: REDIS_URL
        fromService:
          name: atompay-redis
          type: keyvalue
          property: connectionString


  # =======================================================
  # 12. FRONTEND
  # =======================================================
  - type: web
    name: atompay-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist

    routes:
      - type: rewrite
        source: /*
        destination: /index.html